version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Routine bumps arrive as one small PR; majors come one at a time for a deliberate upgrade.
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Runtime is Node 22; keep the types on the same major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # cypress-axe caps the Cypress peer range; bump both together by hand.
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
